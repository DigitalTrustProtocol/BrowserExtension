<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttentionX</title>
    <!--
      Fixed pixel dimensions must be inlined here. Chrome action popups can
      open in auto-size mode before CSS modules load; without min-width the
      window collapses to a sliver. (See w3c/webextensions#692.)
    -->
    <style>
      html,
      body {
        width: 380px;
        height: 600px;
        min-width: 380px;
        min-height: 600px;
        margin: 0;
        overflow: hidden;
      }
      body {
        padding: 8px;
        box-sizing: border-box;
        background: #f4f7f6;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
